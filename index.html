<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecosystem Fire – דשבורד הקצאות תחמושת (אב-טיפוס)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- PROTOTYPE – not production code. All data is mocked (data.js). -->
<div id="viewport">
  <div id="stage" aria-label="Ecosystem Fire dashboard">
    <!-- Static image slices (from Figma screenshot f1-01) -->
    <img class="slice" id="sliceHeader" src="assets/slice-header.png" alt="" width="1920" height="58">
    <div id="frame"><div id="frameTop"></div></div>
    <img class="slice" id="sliceFooter" src="assets/slice-footer.png" alt="" width="1920" height="20">

    <!-- Toolbar -->
    <div id="toolbar" role="toolbar" aria-label="כלים">
      <button class="tb-btn tb-light" id="btnEdit" aria-label="עריכה" title="עריכה">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M4 13.6V16h2.4l7.1-7.1-2.4-2.4L4 13.6zm11.3-6.5a.64.64 0 0 0 0-.9l-1.5-1.5a.64.64 0 0 0-.9 0l-1.2 1.2 2.4 2.4 1.2-1.2z" fill="#fff"/><path d="M3 18h9" stroke="#fff" stroke-width="1.4"/></svg>
      </button>
      <button class="tb-btn tb-light" id="btnAdd" aria-label="דרישת חימוש נוסף" aria-expanded="false" aria-controls="panel" title="דרישת חימוש נוסף">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 3.5v13M3.5 10h13" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button class="tb-btn" id="btnFilter" aria-label="סינון" title="סינון">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3.5 6h13M6 10h8M8.5 14h3" stroke="#e6e8ec" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button class="tb-btn" id="btnSearch" aria-label="חיפוש" title="חיפוש">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="11.2" cy="8.8" r="4.6" fill="none" stroke="#e6e8ec" stroke-width="1.5"/><path d="M7.8 12.2 4 16" stroke="#e6e8ec" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- Date bar -->
    <div id="datebar" role="tablist" aria-label="חלון זמן">
      <div id="dbIndicator" aria-hidden="true"></div>
      <div class="db-tab db-main" role="tab" tabindex="0" data-shift="0" aria-selected="true">
        <button class="db-chev" id="dayNext" aria-label="היום הבא"><img src="assets/chevron-a.svg" alt="" width="18" height="18"></button>
        <span class="db-text" id="dbText"></span>
        <button class="db-chev db-chev-r" id="dayPrev" aria-label="היום הקודם"><img src="assets/chevron-a.svg" alt="" width="18" height="18"></button>
        <span class="db-tags"><img src="assets/tags.svg" alt="" width="24" height="24"><img class="db-dot" src="assets/green-dot.svg" alt="" width="9" height="9"></span>
      </div>
      <div class="db-tab db-shift" role="tab" tabindex="0" data-shift="1" aria-selected="false"><span>06:00 - 14:00</span><i class="badge">1</i></div>
      <div class="db-tab db-shift" role="tab" tabindex="0" data-shift="2" aria-selected="false"><span>14:01 - 19:00</span><i class="badge">2</i></div>
      <div class="db-tab db-shift" role="tab" tabindex="0" data-shift="3" aria-selected="false"><span>19:01 - 06:00</span><i class="badge">3</i></div>
    </div>

    <!-- View toggle -->
    <div id="viewToggle" role="radiogroup" aria-label="תצוגת טבלה">
      <div id="vtPill" aria-hidden="true"></div>
      <button class="vt-seg vt-dot" role="radio" aria-checked="false" aria-disabled="true" title="תצוגה זו לא הוגדרה באב-הטיפוס" data-view="dot"><i></i></button>
      <button class="vt-seg vt-num" role="radio" aria-checked="false" data-view="compact" title="מספרים">123</button>
      <button class="vt-seg vt-bars" role="radio" aria-checked="true" data-view="bars" title="עמודות">
        <svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><rect x="2" y="2" width="2" height="10" rx="1"/><rect x="6" y="5" width="2" height="7" rx="1"/><rect x="10" y="4" width="2" height="8" rx="1"/></svg>
      </button>
    </div>
    <img class="slice" id="sliceApp" src="assets/slice-appselector.png" alt="" width="52" height="36">

    <!-- Table (rendered by app.js) -->
    <section id="table" aria-label="טבלת הקצאות">
      <div id="tBg"></div>
      <div id="groupsViewport"><div id="groups"></div></div>
      <div id="hScroll" aria-hidden="true"><div id="hThumb"></div></div>
      <div id="vScroller" aria-hidden="true"></div>
      <div id="sidebar"></div>
    </section>

    <!-- Timeline (static slice) -->
    <img class="slice" id="sliceTimeline" src="assets/slice-timeline.png" alt="" width="1874" height="169">

    <!-- Expanded cell card -->
    <div id="cellCard" role="dialog" aria-label="פרטי תא" hidden></div>

    <!-- Form panel -->
    <aside id="panel" role="dialog" aria-labelledby="panelTitle" hidden></aside>

    <div id="toast" role="status" aria-live="polite"></div>
  </div>
</div>
<div id="logPanel" role="dialog" aria-label="יומן שינויים" hidden></div>

<!-- Prototype chrome: design options switcher (outside the design) -->
<div id="optbar" role="region" aria-label="אפשרויות עיצוב (אב-טיפוס)">
  <span class="ob-tag">אב-טיפוס</span>
  <label class="ob-group ob-ver"><span class="ver-lbl">גרסה</span><select onchange="location.href=this.value" aria-label="גרסת פרוטוטייפ"><option value="v1/index.html">v1 · מסכים לחיצים</option><option value="index.html" selected>v2 · ממשק אינטראקטיבי</option></select></label>
  <div class="ob-group" data-opt="expand"><span class="ob-label">הרחבת תא</span>
    <button data-val="card">א׳ כרטיסייה מורחבת</button><button data-val="none">ללא</button></div>
  <div class="ob-group" data-opt="cell"><span class="ob-label">עיצוב תא</span>
    <button data-val="default">ברירת מחדל</button><button data-val="ca">ג׳-A</button><button data-val="cb">ג׳-B</button></div>
  <div class="ob-group" data-opt="rows"><span class="ob-label">טופס – הוספת שורות</span>
    <button data-val="auto">א׳ הוספה אוטומטית</button><button data-val="manual">ב׳ כפתור + / −</button></div>
  <button class="ob-log" id="btnLog" aria-haspopup="dialog" aria-expanded="false">מה השתנה</button>
  <button class="ob-reset" id="btnReset" title="איפוס מצב האב-טיפוס">איפוס</button>
</div>

<script src="data.js"></script>
<script src="changelog.js"></script>
<script src="app.js"></script>
</body>
</html>
